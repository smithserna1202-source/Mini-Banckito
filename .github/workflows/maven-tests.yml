name: Maven tests

concurrency:
  group: maven-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
    branches: [ main ]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-mysql-password
          MYSQL_DATABASE: minibanckito
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-mysql-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --quiet --eval \"db.adminCommand('ping').ok\""
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run unit and integration tests (H2)
        run: mvn -B -f bank/bank/pom.xml clean test
      - name: Smoke test Spring Boot API with MySQL
        env:
          BANK_DEFAULT_PASSWORD: "CI-only-password-12345"
          DB_URL: jdbc:mysql://127.0.0.1:3306/minibanckito?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          DB_USERNAME: root
          DB_PASSWORD: ci-mysql-password
        run: |
          cd bank/bank
          mvn -B spring-boot:run > app.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:8080/api/health; then
              break
            fi
            sleep 2
          done
          if ! curl --fail --silent http://localhost:8080/api/health; then
            cat app.log
            exit 1
          fi
          curl --fail --silent http://localhost:8080/v3/api-docs > /dev/null
          curl --fail --silent http://localhost:8080/swagger-ui.html > /dev/null

          # Exercise real MySQL writes and MongoDB append-only audit persistence.
          ACCOUNT_NUMBER="9999000001"
          curl --fail --silent --show-error -u "teller01:$BANK_DEFAULT_PASSWORD" \
            -H "Content-Type: application/json" \
            -d "{\"accountNumber\":\"$ACCOUNT_NUMBER\",\"ownerId\":\"C001\",\"type\":\"SAVINGS\",\"initialBalance\":1000,\"currency\":\"COP\"}" \
            http://localhost:8080/api/accounts > /dev/null

          curl --fail --silent --show-error -u "teller01:$BANK_DEFAULT_PASSWORD" \
            -H "Content-Type: application/json" \
            -d '{"amount":500}' \
            "http://localhost:8080/api/accounts/$ACCOUNT_NUMBER/deposit" > /dev/null

          BALANCE=$(curl --fail --silent --show-error -u "teller01:$BANK_DEFAULT_PASSWORD" \
            "http://localhost:8080/api/accounts/$ACCOUNT_NUMBER/balance")
          echo "$BALANCE" | grep -q "1500"

          HISTORY=$(curl --fail --silent --show-error -u "teller01:$BANK_DEFAULT_PASSWORD" \
            "http://localhost:8080/api/transfers/history/$ACCOUNT_NUMBER")
          echo "$HISTORY" | grep -q "DEPOSIT"

          AUDIT=$(curl --fail --silent --show-error -u "analyst01:$BANK_DEFAULT_PASSWORD" \
            http://localhost:8080/api/audit)
          echo "$AUDIT" | grep -q "ACCOUNT_OPENED"
          echo "$AUDIT" | grep -q "DEPOSIT"
