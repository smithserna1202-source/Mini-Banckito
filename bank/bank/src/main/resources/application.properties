spring.application.name=mini-banckito
spring.datasource.url=jdbc:h2:mem:minibanckito;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.data.mongodb.uri=mongodb://localhost:27017/minibanckito
spring.data.mongodb.database=minibanckito
