spring.application.name=mini-banckito
spring.profiles.default=sql,mongodb

# MySQL is the default relational database. Configure credentials through environment variables.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/minibanckito?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Let Spring Boot infer the JDBC driver and Hibernate dialect from the active datasource.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# MongoDB stores the append-only audit log (active with the default mongodb profile).
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/minibanckito}
spring.data.mongodb.database=${MONGODB_DATABASE:minibanckito}

bank.company-transfers.approval-threshold=${BANK_COMPANY_TRANSFER_APPROVAL_THRESHOLD:5000000}

# OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
