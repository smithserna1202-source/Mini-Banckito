spring.application.name=mini-banckito
spring.profiles.default=sql

# MySQL is the default relational database. Configure credentials through environment variables.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/minibanckito?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# MongoDB audit adapter is activated separately with the "mongodb" profile.
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/minibanckito}
spring.data.mongodb.database=${MONGODB_DATABASE:minibanckito}

# OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
